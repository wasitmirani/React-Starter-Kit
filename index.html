<!DOCTYPE html>
<html lang="en" data-layout="modern" data-theme="material" data-bs-theme="light" data-sidebar-colors="dark" data-sidebar-image="none" data-sidebar="large" data-topbar-colors="light" data-nav-type="boxed" dir="ltr" data-colors="default">
<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#047263">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- Dynamic Title -->
    <title>%VITE_APP_TITLE%</title>

    <!-- Apply Alloce layout prefs before CSS paint to avoid sidebar profile FOUC/jerk -->
    <script>
        (function () {
            var html = document.documentElement;
            // Only user preferences (dark mode, sidebar size) are restored.
            // Colours and chrome come from the BirdCRM theme (src/assets/styles/theme.css).
            var keys = ['data-bs-theme', 'data-sidebar'];

            // Profile widget is opt-in; Alloce removes it unless sessionStorage is exactly "true".
            if (sessionStorage.getItem('data-profile-sidebar') === 'true') {
                html.setAttribute('data-profile-sidebar', 'true');
            } else {
                html.removeAttribute('data-profile-sidebar');
                sessionStorage.removeItem('data-profile-sidebar');
            }

            // Brand colour theme (My profile → Appearance), before the first paint.
            var brands = { lagoon: '#047263', violet: '#6d28d9', ocean: '#2563eb', ember: '#c2410c', berry: '#a21caf' };
            var brand = 'lagoon';
            try { var saved = localStorage.getItem('linqflow.brand'); if (saved && brands[saved]) brand = saved; } catch (e) {}
            html.setAttribute('data-brand', brand);
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', brands[brand]);

            keys.forEach(function (key) {
                var stored = sessionStorage.getItem(key);
                if (stored) {
                    html.setAttribute(key, stored);
                }
            });
        })();
    </script>

    <!-- Primary Meta Tags -->
    <meta name="title" content="%VITE_APP_TITLE%" />
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />
    <meta name="keywords" content="%VITE_APP_KEYWORDS%" />
    <meta name="author" content="%VITE_APP_AUTHOR%" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:title" content="%VITE_APP_TITLE%" />
    <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
    <meta property="og:image" content="%VITE_APP_OG_IMAGE%" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%VITE_APP_URL%" />
    <meta name="twitter:title" content="%VITE_APP_TITLE%" />
    <meta name="twitter:description" content="%VITE_APP_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_APP_OG_IMAGE%" />

    <!-- favicon -->
    <link rel="shortcut icon" href="/assets/images/favicon.ico">

    <!-- Bootstrap CSS (RTL, enabled when dir=rtl) -->
    <link href="/assets/css/bootstrap.rtl.css" rel="stylesheet" type="text/css" disabled>
    <!-- App CSS (RTL, enabled when dir=rtl) -->
    <link href="/assets/css/app.rtl.css" rel="stylesheet" type="text/css" disabled>

    <!-- Prefetch Alloce bundles (loaded after React mounts layout) -->
    <link rel="modulepreload" crossorigin href="/assets/admin.bundle-DOCqQWIh.js">
    <link rel="modulepreload" crossorigin href="/assets/main-BSp6wgyE.js">
    <link rel="modulepreload" crossorigin href="/assets/apexcharts.esm-CF-OO0O0.js">

    <!-- Rubik (Alloce Material) is the UI font; Inter stays as a fallback for older pages. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Rubik:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" crossorigin href="/assets/css/virtual-select.css">
    <link rel="stylesheet" crossorigin href="/assets/css/admin.css">
</head>

<body class="sidebar-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Vendor scripts used across pages -->
  <script src="/assets/virtual-select.min-DQ103J38.js"></script>
  <script src="/assets/libs/dayjs/dayjs.min.js"></script>
  <script src="/assets/libs/dayjs/plugin/quarterOfYear.js"></script>
</body>

</html>
